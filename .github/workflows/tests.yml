name: tests

# Runs the whole test suite on every push to main and on every pull request.
# The tests need no secrets: Hevy is mocked and each test uses a throwaway database.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Stops anything that touches the API-key encryption from writing to /data on the runner.
      FERNET_KEY_PATH: ${{ runner.temp }}/app.key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # same as the Dockerfile
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -t .
