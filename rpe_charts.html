<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f5f1" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161614" />
  <title>RPE tables</title>
  <style>
    :root {
      --bg: #f6f5f1; --card: #ffffff; --text: #1d1d1b; --muted: #6b6a64;
      --line: #e3e1d9; --accent: #1f5fbf; --chip: #eef0f4;
      --danger: #a32d2d; --danger-bg: #fcebeb;
      --near-bg: #e1f1e4; --off-bg: #fbefd5; --far-bg: #f8dfdc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161614; --card: #21211e; --text: #ecebe5; --muted: #a09f97;
        --line: #34332f; --accent: #7fb0ff; --chip: #2b2c30;
        --danger: #f09595; --danger-bg: #3a1f1f;
        --near-bg: #1f3a27; --off-bg: #3d3318; --far-bg: #4a2522;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 900px; margin: 0 auto; padding: 16px; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    header a { color: var(--accent); margin-left: 12px; }
    header nav { white-space: nowrap; }
    h1 { font-size: 22px; font-weight: 500; margin: 8px 0 12px; }
    .lifts { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
    .lifts button { font: inherit; font-size: 14px; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
    .lifts button small { color: var(--muted); margin-left: 4px; }
    .lifts button[aria-pressed="true"] { background: var(--accent); color: var(--card); border-color: transparent; }
    .lifts button[aria-pressed="true"] small { color: inherit; opacity: .8; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 0 0 12px; }
    .sum { font-size: 14px; color: var(--muted); margin: 0 0 10px; }
    .sum b { color: var(--text); font-weight: 500; }
    .scroll { overflow-x: auto; margin: 0 -14px; padding: 0 14px; }
    table { border-collapse: separate; border-spacing: 3px; font-variant-numeric: tabular-nums; }
    th { font-size: 12px; font-weight: 500; color: var(--muted); padding: 2px 4px; }
    th.rpe { position: sticky; left: 0; background: var(--card); text-align: right; padding-right: 8px; z-index: 1; }
    td { min-width: 52px; height: 46px; text-align: center; border-radius: 8px; padding: 2px 3px; vertical-align: middle; background: var(--chip); }
    td .v { font-size: 15px; font-weight: 500; line-height: 1.15; }
    td .s { font-size: 11px; color: var(--muted); line-height: 1.1; }
    td.none { background: transparent; border: 1px dashed var(--line); }
    td.none .v { color: var(--muted); font-weight: 400; opacity: .7; }
    td.near { background: var(--near-bg); }
    td.off { background: var(--off-bg); }
    td.far { background: var(--far-bg); }
    td.blank { background: transparent; border: 0; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 10px 0 0; }
    .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 1px solid var(--line); }
    .note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
    .error { background: var(--danger-bg); color: var(--danger); border-radius: 10px; padding: 10px 12px; margin: 0 0 12px; }
    .empty { text-align: center; color: var(--muted); padding: 28px 8px; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>RPE tables</h1>
    <nav><a href="/progress">Progress</a><a href="/log">Log workout</a></nav>
  </header>
  <div id="status"></div>
  <div class="lifts" id="lifts" role="group" aria-label="Lift"></div>
  <div id="view"></div>
</main>

<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(function () {});</script>
<script>
  const $ = (id) => document.getElementById(id);
  const LIFT_KEY = "rpeCharts.lift";
  const LB_PER_KG = 2.20462;
  let lifts = [], table = new Map(), current = null, loadId = 0;

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }
  function showError(msg) {
    const box = $("status");
    box.replaceChildren();
    if (msg) box.append(el("div", "error", msg));
  }
  async function api(path) {
    const res = await fetch(path);
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.detail || "Something went wrong (" + res.status + ").");
    return body;
  }
  const pct = (f) => (f * 100).toFixed(1);
  const fmtDate = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString(undefined, { month: "short", day: "numeric" }); };

  function renderLifts() {
    const box = $("lifts");
    box.replaceChildren();
    for (const l of lifts) {
      const b = el("button", null, l.title || l.exercise_template_id);
      b.type = "button"; b.setAttribute("aria-pressed", String(l.exercise_template_id === current));
      b.append(el("small", null, l.sets + (l.sets === 1 ? " set" : " sets")));
      b.addEventListener("click", () => select(l.exercise_template_id));
      box.append(b);
    }
  }

  // How far your sets sit from the table in use, in points of e1RM: green within 1, amber within 2.5, red beyond.
  const band = (diff) => (Math.abs(diff) <= 0.01 ? "near" : Math.abs(diff) <= 0.025 ? "off" : "far");

  function renderTable(data) {
    const view = $("view");
    view.replaceChildren();
    const card = el("div", "card");
    const sum = el("p", "sum");
    if (data.anchor_e1rm_lb != null) {
      const b = el("b", null, Math.round(data.anchor_e1rm_lb) + " lb (" + Math.round(data.anchor_e1rm_lb / LB_PER_KG) + " kg)");
      sum.append("Measured against your newest TS e1RM, ", b, " from " + fmtDate(data.anchor_set_at) + ". ");
    } else {
      sum.append("No TS saved for this lift yet. Mark a set as the TS (tap its set number) and save the workout, and the table has something to measure against. ");
    }
    sum.append(data.sets_used + (data.sets_used === 1 ? " set" : " sets") + " used");
    if (data.sets_without_anchor) sum.append(", " + data.sets_without_anchor + " logged before the first TS");
    sum.append(".");
    card.append(sum);

    const cells = new Map(data.cells.map((c) => [c.rpe + "|" + c.reps, c]));
    const rpes = [];
    for (let r = 10; r >= 5; r -= 0.5) rpes.push(r);
    for (const c of data.cells) if (!rpes.includes(c.rpe)) rpes.push(c.rpe);
    rpes.sort((a, b) => b - a);
    const maxReps = Math.max(10, ...data.cells.map((c) => c.reps));

    const t = el("table");
    const head = el("tr");
    head.append(el("th", "rpe", "RPE"));
    for (let n = 1; n <= maxReps; n++) head.append(el("th", null, String(n)));
    t.append(head);
    for (const rpe of rpes) {
      const row = el("tr");
      row.append(el("th", "rpe", String(rpe)));
      for (let n = 1; n <= maxReps; n++) {
        const c = cells.get(rpe + "|" + n), chart = table.get(rpe + "|" + n);
        const td = el("td");
        if (c) {
          const diff = c.chart != null ? c.observed - c.chart : 0;
          td.className = c.chart != null ? band(diff) : "";
          td.append(el("div", "v", pct(c.observed)));
          td.append(el("div", "s", (c.chart != null ? (diff >= 0 ? "+" : "−") + (Math.abs(diff) * 100).toFixed(1) + " · " : "") + "n" + c.n));
          td.title = "Your sets: " + pct(c.observed) + "% of e1RM (" + c.n + (c.n === 1 ? " set" : " sets") + (c.chart != null ? "). Table in use: " + pct(c.chart) + "%." : ").");
        } else if (chart != null) {
          td.className = "none";
          td.append(el("div", "v", pct(chart)));
          td.title = "Table in use: " + pct(chart) + "%. Nothing logged here yet.";
        } else {
          td.className = "blank";
        }
        row.append(td);
      }
      t.append(row);
    }
    const scroll = el("div", "scroll");
    scroll.append(t);
    card.append(scroll);

    const legend = el("div", "legend");
    for (const [cls, text] of [["near", "within 1 point of the table"], ["off", "1 to 2.5 points off"], ["far", "more than 2.5 off"], ["none", "nothing logged yet (the table's value)"]]) {
      const item = el("span");
      const swatch = el("i"); swatch.className = "";
      swatch.style.background = cls === "none" ? "transparent" : "var(--" + cls + "-bg)";
      if (cls === "none") swatch.style.borderStyle = "dashed";
      item.append(swatch, text);
      legend.append(item);
    }
    card.append(legend);
    card.append(el("p", "note", "Each filled cell is the average of your sets at that RPE and reps, as a share of the anchor e1RM, with the gap to the table in use and how many sets it rests on (n). Higher than the table means you can do more than it says at that RPE. Warm-ups, drop sets and the TS itself are left out. A cell on one or two sets is a hint, not a result."));
    view.append(card);
  }

  async function select(id) {
    current = id;
    try { localStorage.setItem(LIFT_KEY, id); } catch (e) { /* storage can be unavailable */ }
    renderLifts();
    const mine = ++loadId;
    try {
      const data = await api("/rpe-observed/" + encodeURIComponent(id));
      if (mine !== loadId) return;
      showError("");
      renderTable(data);
    } catch (err) {
      if (mine === loadId) showError(err.message);
    }
  }

  async function init() {
    try {
      const [list, rows] = await Promise.all([api("/rpe-observed"), api("/rpe-table")]);
      lifts = list;
      table = new Map(rows.rows.map(([rpe, reps, f]) => [rpe + "|" + reps, f]));
    } catch (err) { showError(err.message); return; }
    if (!lifts.length) {
      $("view").append(el("div", "empty", "Nothing here yet. Save a workout from the log page with an RPE on your working sets and a TS set, and this fills in."));
      return;
    }
    let saved = null;
    try { saved = localStorage.getItem(LIFT_KEY); } catch (e) { /* storage can be unavailable */ }
    select(lifts.some((l) => l.exercise_template_id === saved) ? saved : lifts[0].exercise_template_id);
  }
  init();
</script>
</body>
</html>
