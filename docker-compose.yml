services:
  rackbook:
    build: .
    container_name: rackbook
    restart: unless-stopped
    ports:
      - "8126:8126"
    volumes:
      - rackbook-data:/data
    environment:
      - DB_PATH=/data/rackbook.db
    x-casaos:
      envs:
        - container: DB_PATH
          description:
            en_us: SQLite database path

volumes:
  rackbook-data:
    driver: local
