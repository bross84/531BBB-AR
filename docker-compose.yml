services:
  531bbb:
    build: .
    container_name: 531bbb
    restart: unless-stopped
    ports:
      - "8126:8126"
    volumes:
      - 531bbb-data:/data
    environment:
      - DB_PATH=/data/531bbb.db
      - HEVY_API_KEY=${HEVY_API_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    x-casaos:
      envs:
        - container: DB_PATH
          description:
            en_us: SQLite database path
        - container: HEVY_API_KEY
          description:
            en_us: Hevy API key
        - container: ENCRYPTION_KEY
          description:
            en_us: Fernet encryption key for secrets stored in the database

volumes:
  531bbb-data:
    driver: local
